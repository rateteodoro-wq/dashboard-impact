<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IMPACT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:        #D4A017;
            --gold-bright: #F5C518;
            --dark:        #0A0A0A;
            --card:        #111111;
            --card-hover:  #161616;
            --border:      rgba(212,160,23,0.18);
            --border-hover:rgba(212,160,23,0.5);
            --dim:         #888888;
            --grid-line:   rgba(212,160,23,0.07);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--dark);
            background-image:
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 36px 36px;
            color: #E8E8E8;
            min-height: 100vh;
            padding: 1.5rem 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 760px;
            background: var(--card);
            border: 1px solid var(--border);
            padding: 2rem 1.5rem;
            margin-top: 1rem;
            animation: fadeIn 0.5s ease-out forwards;
            position: relative;
        }
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--gold-bright), transparent);
        }

        @media (min-width: 768px) {
            body { padding: 2rem; }
            .container { padding: 3rem; }
        }

        /* HEADER */
        header {
            text-align: center;
            margin-bottom: 2.5rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid var(--border);
        }
        .header-badge {
            font-family: 'Share Tech Mono', monospace;
            font-size: .62rem;
            letter-spacing: .2em;
            color: var(--gold);
            border: 1px solid rgba(212,160,23,.35);
            padding: 3px 12px;
            display: inline-block;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }
        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(2.8rem, 10vw, 4.5rem);
            letter-spacing: .06em;
            color: var(--gold-bright);
            line-height: 1;
            text-shadow: 0 0 60px rgba(212,160,23,.2);
        }
        header p {
            font-family: 'Share Tech Mono', monospace;
            font-size: .72rem;
            letter-spacing: .1em;
            color: var(--dim);
            margin-top: .6rem;
            text-transform: uppercase;
        }

        /* SECTION LABEL */
        .slabel {
            font-family: 'Share Tech Mono', monospace;
            font-size: .64rem;
            letter-spacing: .2em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: .6rem;
            display: flex;
            align-items: center;
            gap: .5rem;
        }
        .slabel::before {
            content: '';
            display: block;
            width: 16px; height: 1px;
            background: var(--gold);
        }

        /* ENERGIA */
        .energia-block {
            margin-bottom: 2rem;
            padding: 1.25rem;
            background: rgba(212,160,23,.04);
            border: 1px solid var(--border);
        }
        .select-wrap { position: relative; }
        select {
            appearance: none;
            width: 100%;
            background: var(--dark);
            border: 1px solid var(--border);
            color: #E8E8E8;
            font-family: 'DM Sans', sans-serif;
            font-size: .95rem;
            padding: .9rem 2.5rem .9rem 1rem;
            outline: none;
            cursor: pointer;
            transition: border-color .2s;
        }
        select:focus { border-color: var(--gold); }
        select option { background: #1a1a1a; }
        .select-arrow {
            pointer-events: none;
            position: absolute;
            inset-y: 0; right: 0;
            display: flex; align-items: center;
            padding: 0 1rem;
            color: var(--gold);
        }

        /* TASK ROWS */
        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.1rem;
        }
        .tasks-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.6rem;
            letter-spacing: .06em;
            color: #E8E8E8;
        }

        #tasks-container { display: flex; flex-direction: column; gap: .75rem; }

        .task-row {
            display: flex;
            flex-direction: column;
            gap: .75rem;
            padding: 1.1rem;
            border: 1px solid var(--border);
            background: var(--dark);
            position: relative;
            transition: border-color .25s;
        }
        .task-row:hover { border-color: var(--border-hover); }

        @media (min-width: 640px) {
            .task-row { flex-direction: row; align-items: flex-end; }
        }

        .field-label {
            display: block;
            font-family: 'Share Tech Mono', monospace;
            font-size: .58rem;
            letter-spacing: .18em;
            color: var(--gold);
            text-transform: uppercase;
            margin-bottom: .4rem;
        }
        .field-label span { color: var(--dim); font-size: .52rem; letter-spacing: .08em; }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            background: var(--card);
            border: 1px solid rgba(212,160,23,.15);
            color: #E8E8E8;
            font-family: 'DM Sans', sans-serif;
            font-size: .92rem;
            padding: .7rem .85rem;
            outline: none;
            transition: border-color .2s, background .2s;
        }
        input[type="text"]:focus,
        input[type="number"]:focus { border-color: var(--gold); background: #161616; }
        input::placeholder { color: rgba(255,255,255,.2); }
        input[type="number"] { text-align: center; }
        input.error { border-color: #ef4444 !important; background: rgba(239,68,68,.06) !important; }

        .input-grow { flex-grow: 1; }
        .input-narrow { width: 100%; }
        @media (min-width: 640px) { .input-narrow { width: 7rem; flex-shrink: 0; } }

        /* remove btn */
        .remove-task {
            background: none;
            border: none;
            color: rgba(255,255,255,.2);
            cursor: pointer;
            padding: .4rem;
            transition: color .2s;
            flex-shrink: 0;
            align-self: flex-end;
        }
        .remove-task:hover { color: #ef4444; }
        @media (min-width: 640px) { .remove-task { align-self: center; margin-bottom: 0; } }

        /* add task btn */
        .add-btn-wrap { margin-top: 1.1rem; text-align: center; }
        #add-task-btn {
            font-family: 'Share Tech Mono', monospace;
            font-size: .72rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            color: var(--gold);
            background: rgba(212,160,23,.06);
            border: 1px solid rgba(212,160,23,.3);
            padding: .6rem 1.4rem;
            cursor: pointer;
            transition: all .2s;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
        }
        #add-task-btn:hover { background: rgba(212,160,23,.12); border-color: var(--gold); }

        /* PRIORITIZE BTN */
        #prioritize-btn {
            width: 100%;
            background: var(--gold-bright);
            color: #0A0A0A;
            font-family: 'Share Tech Mono', monospace;
            font-size: .40rem;
            letter-spacing: .15em;
            text-transform: uppercase;
            font-weight: 700;
            padding: .30rem 0.7rem;
            border: none;
            cursor: pointer;
            margin-top: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .6rem;
            transition: all .22s;
        }
        #prioritize-btn:hover {
            background: #fff;
            box-shadow: 0 0 30px rgba(245,197,24,.35);
            transform: translateY(-2px);
        }

        /* RESULTS */
        #results-section { display: none; opacity: 0; transition: opacity .4s ease; }

        .results-header { text-align: center; margin-bottom: 2rem; }
        .results-icon {
            width: 56px; height: 56px;
            border: 2px solid var(--gold);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            color: var(--gold-bright);
        }
        .results-header h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.8rem, 6vw, 2.8rem);
            letter-spacing: .06em;
            color: #E8E8E8;
        }
        .results-header p {
            font-family: 'Share Tech Mono', monospace;
            font-size: .68rem;
            letter-spacing: .1em;
            color: var(--dim);
            margin-top: .5rem;
            text-transform: uppercase;
        }

        #results-container { display: flex; flex-direction: column; gap: .85rem; margin-bottom: 2rem; }

        .result-card {
            padding: 1.35rem;
            background: var(--dark);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: .9rem;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }
        .result-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 3px;
            height: 100%;
        }
        .rc-1::before { background: var(--gold-bright); }
        .rc-2::before { background: rgba(212,160,23,.5); }
        .rc-3::before { background: rgba(212,160,23,.25); }

        @media (min-width: 640px) {
            .result-card { flex-direction: row; align-items: center; }
        }

        .rc-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .4rem; }
        .rc-step {
            font-family: 'Share Tech Mono', monospace;
            font-size: .6rem;
            letter-spacing: .15em;
            color: var(--gold-bright);
            border: 1px solid rgba(212,160,23,.35);
            padding: 2px 8px;
            text-transform: uppercase;
        }
        .rc-time {
            font-family: 'Share Tech Mono', monospace;
            font-size: .6rem;
            letter-spacing: .12em;
            color: var(--dim);
            border: 1px solid rgba(255,255,255,.08);
            padding: 2px 8px;
            display: inline-flex;
            align-items: center;
            gap: .3rem;
        }
        .rc-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            letter-spacing: .05em;
            color: #E8E8E8;
            margin-bottom: .4rem;
        }
        .rc-reason {
            font-family: 'Share Tech Mono', monospace;
            font-size: .65rem;
            letter-spacing: .08em;
            color: var(--dim);
            padding: .6rem .9rem;
            background: rgba(212,160,23,.04);
            border-left: 2px solid rgba(212,160,23,.3);
        }
        .rc-ratio {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem 1.25rem;
            background: rgba(212,160,23,.05);
            border: 1px solid var(--border);
            min-width: 88px;
            flex-shrink: 0;
        }
        @media (min-width: 640px) { .rc-ratio { display: flex; } }
        .rc-ratio-n {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            color: var(--gold-bright);
            line-height: 1;
        }
        .rc-ratio-l {
            font-family: 'Share Tech Mono', monospace;
            font-size: .55rem;
            letter-spacing: .12em;
            color: var(--dim);
            margin-top: 3px;
            text-transform: uppercase;
        }

        /* ACTIONS */
        .actions-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: .75rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
        }
        @media (min-width: 480px) { .actions-grid { grid-template-columns: 1fr 1fr; } }

        .btn-notion {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .5rem;
            background: var(--dark);
            border: 1px solid var(--border);
            color: var(--dim);
            font-family: 'Share Tech Mono', monospace;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            text-decoration: none;
            padding: .9rem 1rem;
            transition: all .22s;
        }
        .btn-notion:hover { border-color: var(--gold); color: var(--gold); }

        #new-session-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: .5rem;
            background: var(--gold-bright);
            border: none;
            color: #0A0A0A;
            font-family: 'Share Tech Mono', monospace;
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            font-weight: 700;
            padding: .9rem 1rem;
            cursor: pointer;
            transition: all .22s;
        }
        #new-session-btn:hover { background: #fff; box-shadow: 0 0 20px rgba(245,197,24,.3); }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: none; }
        }
        .fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div class="container">

        <header>
            <div class="header-badge">Sistema IMPACT // Motor de Priorização</div>
            <h1>Dashboard IMPACT</h1>
            <p>Priorização por energia · esforço · impacto real</p>
        </header>

        <!-- FORM -->
        <div id="form-section">

            <!-- Energia -->
            <div class="energia-block">
                <div class="slabel">Sua Energia Atual</div>
                <div class="select-wrap">
                    <select id="energia">
                        <option value="Alta">⚡ Alta — Pronto para desafios difíceis</option>
                        <option value="Media" selected>⚖️ Média — Focado em custo-benefício</option>
                        <option value="Baixa">🔋 Baixa — Precisando de vitórias rápidas</option>
                    </select>
                    <div class="select-arrow">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Tasks -->
            <div class="tasks-header">
                <h2>Suas Tarefas</h2>
            </div>

            <div id="tasks-container">
                <div class="task-row fade-in">
                    <div class="input-grow">
                        <label class="field-label">Tarefa *</label>
                        <input type="text" class="task-name" placeholder="Ex: Escrever relatório mensal...">
                    </div>
                    <div class="input-narrow">
                        <label class="field-label">Impacto <span>(1-10)</span></label>
                        <input type="number" class="task-impact" min="1" max="10" value="5">
                    </div>
                    <div class="input-narrow">
                        <label class="field-label">Esforço <span>(1-10)</span></label>
                        <input type="number" class="task-effort" min="1" max="10" value="5">
                    </div>
                    <button class="remove-task" title="Remover tarefa" onclick="this.parentElement.remove()">
                        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="add-btn-wrap">
                <button id="add-task-btn">
                    <svg class="h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 5a1 1 0 011 1v3h3a1 1 0 110 2h-3v3a1 1 0 11-2 0v-3H6a1 1 0 110-2h3V6a1 1 0 011-1z" clip-rule="evenodd"/>
                    </svg>
                    Adicionar nova linha
                </button>
            </div>

            <button id="prioritize-btn">
                <span>Priorizar Minhas Tarefas</span>
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
            </button>
        </div>

        <!-- RESULTS -->
        <div id="results-section">
            <div class="results-header">
                <div class="results-icon">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h2>Seus Próximos Passos Absolutos</h2>
                <p>Motor calculou a matriz · energia vs. impacto vs. esforço</p>
            </div>

            <div id="results-container"></div>

            <div class="actions-grid">
                <a href="#" class="btn-notion">
                    <svg class="w-4 h-4 flex-shrink-0" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M4.459 4.208c.745-.636 1.83-.889 3.093-.889h6.126c2.408 0 4.09 1.157 5.097 2.723l.115.186c.338.563.541 1.205.617 1.874l.019.227v9.423c0 1.24-.26 2.373-.918 3.133-.746.862-1.928 1.115-3.192 1.115H9.3c-2.408 0-4.09-1.157-5.098-2.723a4.7 4.7 0 0 1-.722-2.02l-.013-.208v-9.5c0-1.22.257-2.336.907-3.085zm10.74 3.792h-5.41a.75.75 0 0 0-.75.75v5.41a.75.75 0 0 0 1.5 0V10.12l4.13 4.13a.75.75 0 0 0 1.06-1.06l-4.13-4.13h3.6a.75.75 0 0 0 0-1.5z"/>
                    </svg>
                    Adicionar ao Notion
                </a>
                <button id="new-session-btn">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Nova Sessão
                </button>
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formSection     = document.getElementById('form-section');
            const resultsSection  = document.getElementById('results-section');
            const tasksContainer  = document.getElementById('tasks-container');
            const addTaskBtn      = document.getElementById('add-task-btn');
            const prioritizeBtn   = document.getElementById('prioritize-btn');
            const resultsContainer= document.getElementById('results-container');
            const newSessionBtn   = document.getElementById('new-session-btn');
            const energiaSelect   = document.getElementById('energia');

            const createTaskRow = () => {
                const row = document.createElement('div');
                row.className = 'task-row fade-in';
                row.innerHTML = `
                    <div class="input-grow">
                        <label class="field-label">Tarefa *</label>
                        <input type="text" class="task-name" placeholder="Ex: Nova tarefa...">
                    </div>
                    <div class="input-narrow">
                        <label class="field-label">Impacto <span>(1-10)</span></label>
                        <input type="number" class="task-impact" min="1" max="10" value="5">
                    </div>
                    <div class="input-narrow">
                        <label class="field-label">Esforço <span>(1-10)</span></label>
                        <input type="number" class="task-effort" min="1" max="10" value="5">
                    </div>
                    <button class="remove-task" title="Remover tarefa" onclick="this.parentElement.remove()">
                        <svg class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"/>
                        </svg>
                    </button>
                `;
                return row;
            };

            addTaskBtn.addEventListener('click', () => {
                const newRow = createTaskRow();
                tasksContainer.appendChild(newRow);
                newRow.querySelector('.task-name').focus();
            });

            prioritizeBtn.addEventListener('click', () => {
                const energia = energiaSelect.value;
                const taskRows = document.querySelectorAll('.task-row');
                let tasks = [];
                let isValid = true;

                taskRows.forEach(row => {
                    const nameInput   = row.querySelector('.task-name');
                    const impactInput = row.querySelector('.task-impact');
                    const effortInput = row.querySelector('.task-effort');
                    const name   = nameInput.value.trim();
                    const impact = parseFloat(impactInput.value);
                    const effort = parseFloat(effortInput.value);

                    if (!name) { nameInput.classList.add('error'); isValid = false; }
                    else nameInput.classList.remove('error');
                    if (isNaN(impact) || impact < 1 || impact > 10) { impactInput.classList.add('error'); isValid = false; }
                    else impactInput.classList.remove('error');
                    if (isNaN(effort) || effort < 1 || effort > 10) { effortInput.classList.add('error'); isValid = false; }
                    else effortInput.classList.remove('error');

                    if (name && !isNaN(impact) && !isNaN(effort)) {
                        tasks.push({ name, impact, effort, ratio: impact / effort, tempoEstimado: effort * 5 });
                    }
                });

                if (!isValid) { alert("Preencha todas as tarefas com valores de 1 a 10."); return; }
                if (tasks.length === 0) { alert("Adicione pelo menos uma tarefa."); return; }

                tasks.sort((a, b) => {
                    if (energia === "Alta") {
                        return b.impact !== a.impact ? b.impact - a.impact : b.ratio - a.ratio;
                    } else if (energia === "Baixa") {
                        return a.effort !== b.effort ? a.effort - b.effort : b.ratio - a.ratio;
                    } else {
                        return b.ratio !== a.ratio ? b.ratio - a.ratio : b.impact - a.impact;
                    }
                });

                const topTasks = tasks.slice(0, 3);
                resultsContainer.innerHTML = '';

                const reasonMap = {
                    Alta:  "Alta energia detectada. Foco em alto impacto absoluto.",
                    Baixa: "Baixa energia. Tarefa de baixo esforço para gerar momentum.",
                    Media: "Energia equilibrada. Maior retorno (Impacto/Esforço) selecionado."
                };

                topTasks.forEach((task, index) => {
                    const card = document.createElement('div');
                    card.className = `result-card rc-${index + 1}`;
                    card.style.animation = `fadeIn 0.5s ease-out ${index * 0.15 + 0.2}s forwards`;
                    card.innerHTML = `
                        <div style="flex-grow:1; padding-left:.5rem;">
                            <div class="rc-meta">
                                <span class="rc-step">${index + 1}º Passo</span>
                                <span class="rc-time">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    ${task.tempoEstimado} min de foco
                                </span>
                            </div>
                            <p class="rc-name">${task.name}</p>
                            <p class="rc-reason">⚡ ${reasonMap[energia]}</p>
                        </div>
                        <div class="rc-ratio">
                            <span class="rc-ratio-n">${task.ratio.toFixed(1)}</span>
                            <span class="rc-ratio-l">Ratio</span>
                        </div>
                    `;
                    resultsContainer.appendChild(card);
                });

                formSection.style.opacity = '0';
                setTimeout(() => {
                    formSection.style.display = 'none';
                    resultsSection.style.display = 'block';
                    setTimeout(() => {
                        resultsSection.style.opacity = '1';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }, 50);
                }, 350);
            });

            newSessionBtn.addEventListener('click', () => {
                document.querySelectorAll('.task-row').forEach((row, i) => {
                    if (i > 0) row.remove();
                    else {
                        row.querySelector('.task-name').value = '';
                        row.querySelector('.task-impact').value = '5';
                        row.querySelector('.task-effort').value = '5';
                    }
                });
                energiaSelect.value = 'Media';
                resultsSection.style.opacity = '0';
                setTimeout(() => {
                    resultsSection.style.display = 'none';
                    formSection.style.display = 'block';
                    setTimeout(() => {
                        formSection.style.opacity = '1';
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    }, 50);
                }, 350);
            });
        });
    </script>
</body>
</html>
